[project]
name = "sardbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Victor Hiroki", email = "vhiroki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.52",
    "click>=8.3.3",
    "flask>=3.1.3",
    "google-cloud-storage>=3.10.1",
    "gunicorn>=26.0.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "quantstats>=0.0.81",
    "requests>=2.33.1",
]

[project.scripts]
sardbot = "sardbot:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
